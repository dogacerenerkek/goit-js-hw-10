<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Timer</title>
</head>

<body>
    <input type="text" id="datetime-picker" />
    <button type="button" data-start disabled>Start</button>

    <div class="timer">
        <div>
            <span data-days>00</span>
            <p>Days</p>
        </div>
        <div>
            <span data-hours>00</span>
            <p>Hours</p>
        </div>
        <div>
            <span data-minutes>00</span>
            <p>Minutes</p>
        </div>
        <div>
            <span data-seconds>00</span>
            <p>Seconds</p>
        </div>
    </div>

    <script type="module" src="./js/01-timer.js"></script>
</body>

</html>
